name: Lint

on:
  push:
    branches: ["main", "beta"]
    paths:
      - 'source/**'
      - '.github/workflows/lint.yml'
  # No paths filter on pull requests: Ruff is a required status check, and a
  # filtered-out required check never reports, which would block the pull request.
  pull_request:
    branches: ["main", "beta"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.16.9  # keep equal to source/poetry.lock

      - name: Ruff check (lint)
        working-directory: source
        run: ruff check .

      - name: Ruff format (formatting)
        working-directory: source
        run: ruff format --check .
