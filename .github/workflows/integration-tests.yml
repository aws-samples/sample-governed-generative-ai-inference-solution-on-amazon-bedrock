name: Integration Tests (Tier 2)
on:
  push:
    branches: [main, beta]
    paths:
      - 'source/**'
      - 'deployment/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main, beta]
    paths:
      - 'source/**'
      - 'deployment/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==2.4.3  # the Poetry that generated source/poetry.lock

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: source/.venv
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('source/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        working-directory: source
        run: poetry install

      - name: Install cfn-lint
        run: pip install cfn-lint==1.60.1  # keep equal to source/poetry.lock

      - name: Run integration tests
        working-directory: source
        run: poetry run pytest tests/integration/ -v --tb=short
