AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS IAM Identity Center authentication for Governed Inference Platform on Amazon Bedrock'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming"
        Parameters:
          - IdentityPoolName
      - Label:
          default: "Model governance"
        Parameters:
          - AllowedBedrockRegions
          - RestrictToAnthropicModels
          - AllowOpenAIModels
      - Label:
          default: "Monitoring"
        Parameters:
          - EnableMonitoring
          - MonitoringMode
    ParameterLabels:
      IdentityPoolName:
        default: "Resource name prefix (the policy is <prefix>-BedrockAccessPolicy)"
      AllowedBedrockRegions:
        default: "Allowed Amazon Bedrock regions"
      RestrictToAnthropicModels:
        default: "Restrict to Anthropic models only"
      AllowOpenAIModels:
        default: "Admit OpenAI models on bedrock-runtime (ChatGPT Work and Codex)"
      EnableMonitoring:
        default: "Enable monitoring and logging"
      MonitoringMode:
        default: "Monitoring mode (sidecar grants direct OTLP writes)"

# IAM Identity Center users call Bedrock with their permission set's role
# credentials; nothing assumes a role from this stack. The stack creates one
# customer managed policy (model allow-list, Region scope, Mantle deny, and the
# monitoring statements). Attach it to the permission set as a customer managed
# policy reference by name (output PolicyName, path /); `gip deploy auth` prints
# the command. Policy updates from a redeploy then apply without re-provisioning.

Parameters:
  IdentityPoolName:
    Type: String
    Description: Resource name prefix; the policy is named <IdentityPoolName>-BedrockAccessPolicy

  AllowedBedrockRegions:
    Type: CommaDelimitedList
    Default: 'af-south-1,ap-east-2,ap-northeast-1,ap-northeast-2,ap-northeast-3,ap-south-1,ap-south-2,ap-southeast-1,ap-southeast-2,ap-southeast-3,ap-southeast-4,ca-central-1,ca-west-1,eu-central-1,eu-central-2,eu-north-1,eu-south-1,eu-south-2,eu-west-1,eu-west-2,eu-west-3,il-central-1,me-central-1,me-south-1,sa-east-1,us-east-1,us-east-2,us-west-1,us-west-2'
    Description: Comma-delimited list of AWS regions allowed for Bedrock access

  RestrictToAnthropicModels:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      When 'true', restricts Bedrock model invocation to Anthropic models only
      (server-side model governance; client-side model locks remain bypassable
      without it). Default 'true' enforces server-side Anthropic model scoping;
      set 'false' only for explicitly approved non-Anthropic or opaque
      application-inference-profile deployments.

  AllowOpenAIModels:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      When 'true', also admits OpenAI models on the bedrock-runtime endpoint
      (ChatGPT Work and Codex `amazon-bedrock-runtime` provider, ADR-0037):
      bedrock:InvokeModel on openai.* foundation models, *.openai.* cross-Region
      inference profiles and the account's default project. Default 'false'
      leaves the policy unchanged. The bedrock-mantle deny is unaffected.

  EnableMonitoring:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable monitoring and logging capabilities

  MonitoringMode:
    Type: String
    Default: 'central'
    AllowedValues:
      - 'central'
      - 'sidecar'
    Description: >-
      Monitoring mode. Only 'sidecar' grants direct OTLP metric writes, which the local collector
      needs; central mode exports through the ALB collector and does not need them.

Conditions:
  MonitoringEnabled: !Equals [!Ref EnableMonitoring, 'true']
  SidecarOtlpIngest: !And
    - !Condition MonitoringEnabled
    - !Equals [!Ref MonitoringMode, 'sidecar']
  AnthropicModelsOnly: !Equals [!Ref RestrictToAnthropicModels, 'true']
  OpenAIModelsAllowed: !Equals [!Ref AllowOpenAIModels, 'true']

Resources:
  # Customer managed policy for the IAM Identity Center permission set. It must
  # exist (same name, path /) in each account the permission set is assigned to.
  BedrockAccessPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Sub '${IdentityPoolName}-BedrockAccessPolicy'
      Description: 'Bedrock access for the IAM Identity Center permission set: model allow-list, Region scope, Mantle deny'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyBedrockMantleEndpoint
            Effect: Deny
            Action: 'bedrock-mantle:*'
            Resource: '*'
          - Sid: AllowBedrockInvokeRegional
            Effect: Allow
            Action:
              - 'bedrock:InvokeModel'
              - 'bedrock:InvokeModelWithResponseStream'
              - 'bedrock:CallWithBearerToken'
              - 'bedrock:ListFoundationModels'
              - 'bedrock:ListInferenceProfiles'
            # application-inference-profile IDs are opaque and cannot be
            # pattern-matched by model, so both branches keep them.
            # inference-profile/*.anthropic.* matches the us./eu./apac./au./jp./global.
            # cross-region inference profile prefixes.
            Resource: !If
              - AnthropicModelsOnly
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*.anthropic.*'
              - - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          # ADR-0037: OpenAI models on the bedrock-runtime endpoint (ChatGPT Work
          # and Codex `amazon-bedrock-runtime` provider). Verified live on
          # 2026-10-02: a Responses API call (streaming included) authorizes
          # bedrock:InvokeModel on the CRIS inference profile, the source-Region
          # foundation model, the account's default project and, for global.*
          # profiles, the region-less foundation model. Mantle stays denied by
          # DenyBedrockMantleEndpoint above.
          - !If
            - OpenAIModelsAllowed
            - Sid: AllowOpenAIInvokeRegional
              Effect: Allow
              Action: 'bedrock:InvokeModel'
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/openai.*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*.openai.*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:project/default'
              Condition:
                StringEquals:
                  'aws:RequestedRegion': !Ref AllowedBedrockRegions
            - !Ref 'AWS::NoValue'
          - !If
            - OpenAIModelsAllowed
            - Sid: AllowOpenAIInvokeGlobal
              Effect: Allow
              Action: 'bedrock:InvokeModel'
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:::foundation-model/openai.*'
            - !Ref 'AWS::NoValue'
          # F-011: Enforced guardrails require callers to apply the selected
          # guardrail during model invocation.
          - Sid: AllowOwnAccountGuardrails
            Effect: Allow
            Action: 'bedrock:ApplyGuardrail'
            # guardrail-profile/*: a Standard-tier guardrail is evaluated through a
            # system-defined guardrail profile in the destination Regions.
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail-profile/*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
          # Claude Desktop's credential helper returns a short-term Amazon Bedrock API key
          # (a presigned CallWithBearerToken URL signed with these credentials). The action
          # has no resource type, so it is scoped by Region and token type instead.
          - Sid: AllowBedrockShortTermBearerToken
            Effect: Allow
            Action: 'bedrock:CallWithBearerToken'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref AllowedBedrockRegions
                'bedrock:BearerTokenType': 'SHORT_TERM'
          - Sid: AllowBedrockModelInfo
            Effect: Allow
            Action:
              - 'bedrock:GetFoundationModel'
              - 'bedrock:ListFoundationModels'
            Resource: '*'
          # CloudWatch Logs (if monitoring enabled)
          - !If
            - MonitoringEnabled
            - Sid: AllowCloudWatchLogs
              Effect: Allow
              Action:
                - 'logs:CreateLogGroup'
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
                - 'logs:DescribeLogGroups'
                - 'logs:DescribeLogStreams'
              Resource: !Sub 'arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/gip/*'
            - !Ref 'AWS::NoValue'
          # Metric publishing is scoped to the usage namespaces (same pattern as the
          # bedrock-auth-* OIDC templates) so a user cannot poison arbitrary
          # CloudWatch namespaces.
          - !If
            - MonitoringEnabled
            - Sid: AllowCloudWatchMetrics
              Effect: Allow
              Action:
                - 'cloudwatch:PutMetricData'
              Resource: '*'
              Condition:
                StringEquals:
                  'cloudwatch:namespace':
                    - 'GIP/Bedrock/Usage'
                    - 'AWS/Bedrock'
            - !Ref 'AWS::NoValue'
          # OTLP ingest (sidecar collector) carries no cloudwatch:namespace and is
          # authorized against the account's OTLP dataset; allow only that. The IDC
          # sidecar collector signs with the permission set's role credentials.
          - !If
            - SidecarOtlpIngest
            - Sid: AllowCloudWatchOtlpMetrics
              Effect: Allow
              Action:
                - 'cloudwatch:PutMetricData'
              Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:dataset/default'
              Condition:
                'Null':
                  'cloudwatch:namespace': 'true'
            - !Ref 'AWS::NoValue'
          # Read-only metric queries; these APIs are not resource-scoped and
          # ListMetrics without a Namespace filter must keep working.
          - !If
            - MonitoringEnabled
            - Sid: AllowCloudWatchRead
              Effect: Allow
              Action:
                - 'cloudwatch:GetMetricStatistics'
                - 'cloudwatch:ListMetrics'
              Resource: '*'
            - !Ref 'AWS::NoValue'

Outputs:
  PolicyArn:
    Description: 'ARN of the Bedrock access policy'
    Value: !Ref BedrockAccessPolicy
    Export:
      Name: !Sub '${AWS::StackName}-PolicyArn'

  PolicyName:
    Description: 'Name of the Bedrock access policy (path /), for the permission set customer managed policy reference'
    Value: !Sub '${IdentityPoolName}-BedrockAccessPolicy'
